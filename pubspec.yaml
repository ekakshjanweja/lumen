name: lumen
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_blue_plus: ^2.3.14
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  freezed: ^4.0.2
  build_runner: ^2.16.2

flutter:
  uses-material-design: true

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
